sonar.projectKey=atlas-frontend
sonar.projectName=Atlas Frontend
sonar.projectVersion=1.0.0

# Rutas de código
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx
sonar.exclusions=**/node_modules/**,**/coverage/**,src/reportWebVitals.js,src/main.jsx,src/index.css

# Reportes de Cobertura para JavaScript/TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
