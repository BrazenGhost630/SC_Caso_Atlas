sonar.projectKey=AtlasBackend
sonar.projectName=Atlas Backend
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.exclusions=**/node_modules/**,**/coverage/**,sql/**

# Ubicación de los reportes generados por Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-report.xml


# comando docker run -d --name sonarqube -p 9000:9000 sonarqube:lts-community